<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
	<title id="title">BetterCalapan</title>
	<desc id="description">Community portal for Calapan City services and public information</desc>
	<defs>
		<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#fffdf8" />
			<stop offset="1" stop-color="#f5ecdf" />
		</linearGradient>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
			<circle cx="3" cy="3" r="2" fill="#d9cbbd" />
		</pattern>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#342b25" flood-opacity="0.12" />
		</filter>
	</defs>

	<rect width="1200" height="630" fill="url(#paper)" />
	<path d="M0 0h1200v18H0z" fill="#ff5500" />
	<circle cx="1115" cy="90" r="185" fill="#ff5500" opacity="0.1" />
	<circle cx="80" cy="620" r="145" fill="#ff5500" opacity="0.08" />
	<rect x="915" y="20" width="285" height="230" fill="url(#dots)" opacity="0.7" />

	<g font-family="DejaVu Sans, sans-serif" fill="#302925">
		<text x="72" y="92" font-size="22" font-weight="700" letter-spacing="4">COMMUNITY CIVIC PORTAL</text>
		<text x="68" y="230" font-size="84" font-weight="800" letter-spacing="-4">Better</text>
		<g transform="translate(356 150) rotate(-2)">
			<rect width="360" height="102" rx="14" fill="#ff5500" />
			<text x="18" y="78" font-size="84" font-weight="800" letter-spacing="-4" fill="#fffdf8">Calapan</text>
		</g>
		<text x="72" y="320" font-size="32" font-weight="600">City services and public information,</text>
		<text x="72" y="362" font-size="32" font-weight="600">made easier to find.</text>
		<text x="72" y="548" font-size="25" font-weight="700">bettercalapan.org</text>
		<text x="72" y="582" font-size="18" fill="#655b54">Independent · Open source · Built for the community</text>
	</g>

	<g transform="translate(810 142)" font-family="DejaVu Sans, sans-serif" filter="url(#shadow)">
		<g transform="rotate(2 148 58)">
			<rect width="296" height="116" rx="28" fill="#302925" />
			<circle cx="50" cy="58" r="24" fill="#ff5500" />
			<path d="M42 58h16m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
			<text x="90" y="66" font-size="23" font-weight="700" fill="#fff">CITY SERVICES</text>
		</g>
		<g transform="translate(-28 133) rotate(-2 148 58)">
			<rect width="296" height="116" rx="28" fill="#eadfd3" />
			<circle cx="50" cy="58" r="24" fill="#ff5500" />
			<path d="M42 58h16m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
			<text x="90" y="66" font-size="23" font-weight="700" fill="#302925">GOVERNMENT</text>
		</g>
		<g transform="translate(9 266) rotate(1 148 58)">
			<rect width="296" height="116" rx="28" fill="#fffdf8" stroke="#d9cbbd" stroke-width="3" />
			<circle cx="50" cy="58" r="24" fill="#ff5500" />
			<path d="M42 58h16m-7-7 7 7-7 7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
			<text x="90" y="66" font-size="23" font-weight="700" fill="#302925">PUBLIC DATA</text>
		</g>
	</g>
</svg>
